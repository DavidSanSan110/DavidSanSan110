name: GitHub metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidSanSan110
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_followup: yes
          plugin_habits: yes
